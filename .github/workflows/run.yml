name: Compile ruleset

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: compile-ruleset
  cancel-in-progress: false

env:
  SING_BOX_VERSION: "1.12.25"
  CHINA_IP_LIST_URL: "https://raw.githubusercontent.com/gaoyifan/china-operator-ip/ip-lists/china46.txt"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Install sing-box
        shell: bash
        run: |
          set -Eeuo pipefail

          archive="sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          install_dir="${RUNNER_TEMP}/sing-box-${SING_BOX_VERSION}-linux-amd64"

          curl -fsSLo "${RUNNER_TEMP}/${archive}" \
            "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/${archive}"

          tar -xzf "${RUNNER_TEMP}/${archive}" \
            -C "${RUNNER_TEMP}"

          "${install_dir}/sing-box" version
          echo "${install_dir}" >> "${GITHUB_PATH}"

      - name: Build China IP ruleset
        shell: bash
        run: |
          set -Eeuo pipefail

          source_file="${RUNNER_TEMP}/china46.txt"
          output_dir="ruleset"
          json_file="${output_dir}/cn.json"
          srs_file="${output_dir}/cn.srs"

          echo "Downloading China IP list..."

          curl -fsSLo "${source_file}" \
            "${CHINA_IP_LIST_URL}"

          mkdir -p "${output_dir}"

          # Convert the plain-text CIDR list to the sing-box source format.
          jq -n --rawfile ips "${source_file}" '
            (
              $ips
              | split("\n")
              | map(rtrimstr("\r"))
              | map(select(length > 0))
            ) as $cidrs
            | if ($cidrs | length) == 0 then
                error("Downloaded China IP list is empty")
              else
                {
                  version: 2,
                  rules: [
                    {
                      ip_cidr: $cidrs
                    }
                  ]
                }
              end
          ' > "${json_file}"

          entry_count="$(
            jq -r '.rules[0].ip_cidr | length' "${json_file}"
          )"

          echo "Created ${json_file} with ${entry_count} CIDR entries"
          echo "Compiling: ${json_file}"

          sing-box rule-set compile \
            --output "${srs_file}" \
            "${json_file}"

          echo "Created ${srs_file}"

      - name: Commit and push changes
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "github-actions[bot]@users.noreply.github.com"

          git add -A ruleset

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          commit_date="$(date -u +%F)"

          git commit \
            -m "chore: update China IP ruleset (${commit_date})"

          git push origin HEAD:main

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 30
          keep_minimum_runs: 0
