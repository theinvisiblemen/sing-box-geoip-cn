name: Compile ruleset

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: compile-ruleset
  cancel-in-progress: false

env:
  SING_BOX_VERSION: "1.12.25"
  CHINA_IPV4_LIST_URL: "https://gaoyifan.github.io/china-operator-ip/china.txt"
  CHINA_IPV4_IPV6_LIST_URL: "https://gaoyifan.github.io/china-operator-ip/china46.txt"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Install sing-box
        shell: bash
        run: |
          set -Eeuo pipefail

          archive="sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          install_dir="${RUNNER_TEMP}/sing-box-${SING_BOX_VERSION}-linux-amd64"

          curl -fsSLo "${RUNNER_TEMP}/${archive}" \
            "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/${archive}"

          tar -xzf "${RUNNER_TEMP}/${archive}" \
            -C "${RUNNER_TEMP}"

          "${install_dir}/sing-box" version
          echo "${install_dir}" >> "${GITHUB_PATH}"

      - name: Build China IP rulesets
        shell: bash
        run: |
          set -Eeuo pipefail

          output_dir="ruleset"

          build_ruleset() {
            local name="$1"
            local source_url="$2"
            local source_file="${RUNNER_TEMP}/${name}.txt"
            local json_file="${output_dir}/${name}.json"
            local srs_file="${output_dir}/${name}.srs"
            local entry_count

            echo "Downloading ${name} IP list..."

            curl -fsSLo "${source_file}" \
              "${source_url}"

            # Convert the plain-text CIDR list to the sing-box source format.
            jq -n --rawfile ips "${source_file}" '
              (
                $ips
                | split("\n")
                | map(rtrimstr("\r"))
                | map(select(length > 0))
              ) as $cidrs
              | if ($cidrs | length) == 0 then
                  error("Downloaded IP list is empty")
                else
                  {
                    version: 2,
                    rules: [
                      {
                        ip_cidr: $cidrs
                      }
                    ]
                  }
                end
            ' > "${json_file}"

            entry_count="$(
              jq -r ".rules[0].ip_cidr | length" "${json_file}"
            )"

            echo "Created ${json_file} with ${entry_count} CIDR entries"
            echo "Compiling: ${json_file}"

            sing-box rule-set compile \
              --output "${srs_file}" \
              "${json_file}"

            echo "Created ${srs_file}"
          }

          mkdir -p "${output_dir}"

          # Build the IPv4-only and dual-stack rule sets.
          build_ruleset "china" "${CHINA_IPV4_LIST_URL}"
          build_ruleset "china46" "${CHINA_IPV4_IPV6_LIST_URL}"

      - name: Commit and push changes
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "github-actions[bot]@users.noreply.github.com"

          git add -A ruleset

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          commit_date="$(date -u +%F)"

          git commit \
            -m "chore: update China IP rulesets (${commit_date})"

          git push origin HEAD:main

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 30
          keep_minimum_runs: 0
